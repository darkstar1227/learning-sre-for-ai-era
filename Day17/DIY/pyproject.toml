[project]
name = "day17-sli"
version = "0.1.0"
description = "Day 17 DIY: SLI Fixture Testing for AI Application"
readme = "README.md"
authors = [
    { name = "Justin Lee", email = "justin30303.jl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "prometheus-client>=0.19.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
