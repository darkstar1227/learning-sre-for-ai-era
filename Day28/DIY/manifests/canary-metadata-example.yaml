# Why this metadata matters for troubleshooting
# When a user reports quality issue:
# 1. Get request_id from error message
# 2. Look up trace_id in observability platform
# 3. From trace, read change_id, prompt_version, model_route
# 4. Compare metrics for this version vs baseline
# 5. If degradation, use change_id to find manifest & rollback info
# 6. Decide: rollback, continue canary, or escalate
