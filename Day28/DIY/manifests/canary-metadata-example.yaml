request_1:
  request_id: "req-2026092101-001"
  trace_id: "trace-abc123def456"
  change_id: "answer-v17"
  release_stage: "canary"
  prompt_version: "2026-09-21-a"
  model_route: "google/gemini-3.6-flash"
  retrieval_index_version: "retrieval-idx-v12"
  evaluator_version: "citation-evaluator-v2"
  deployment_id: "deploy-2026-09-21-001"
  canary_percentage: 5
  user_segment: "policy_qa_users"
  timestamp: "2026-09-21T10:30:00Z"

request_2:
