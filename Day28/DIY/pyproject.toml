[project]
name = "day28-change-manifest"
version = "0.1.0"
description = "CI/CD & AI Change Management - Change manifest validation and tracking"
readme = "README.md"
authors = [
    { name = "Justin Lee", email = "justin30303.jl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
