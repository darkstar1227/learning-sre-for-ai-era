[project]
name = "day15-sre-for-ai-era"
version = "0.1.0"
description = "Day15 DIY - availability classifier for Learning SRE for the AI Era"
requires-python = ">=3.14"
dependencies = [
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
