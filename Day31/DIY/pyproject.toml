[project]
name = "day31-langsmith-integration"
version = "0.1.0"
description = "Day31 DIY - LangSmith Integration: Dataset, Evaluation, Release Gate"
readme = "README.md"
authors = [
    { name = "Justin Lee", email = "justin.lee@cancerfree.io" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "langsmith>=0.12.2",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
