[project]
name = "day16-sre-for-ai-era"
version = "0.1.0"
description = "Day16 DIY - tail latency (P95) vs mean latency analysis for Learning SRE for the AI Era"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.27.0",
    "prometheus-client>=0.19.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
