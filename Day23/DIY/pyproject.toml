[project]
name = "day23-trace-schema"
version = "0.1.0"
description = "Day 23 DIY: LLM Observability Trace Schema Contract"
readme = "README.md"
authors = [
    { name = "Justin Lee", email = "justin.lee@cancerfree.io" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
