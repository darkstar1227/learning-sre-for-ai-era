[project]
name = "day8-response-evaluation"
version = "0.1.0"
description = "Day8 DIY - Reliability/Quality/Safety response evaluation pipeline built on Day7's Grounded Q&A API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "prometheus-client>=0.21.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
