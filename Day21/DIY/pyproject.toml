[project]
name = "day21-observability"
version = "0.1.0"
description = "Day21 DIY - Metrics, Logs, Traces: Same Event, Three Views"
readme = "README.md"
authors = [
    { name = "Justin Lee", email = "justin.lee@cancerfree.io" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "pydantic>=2.5.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
