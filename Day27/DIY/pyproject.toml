[project]
name = "day27-incident-response"
version = "0.1.0"
description = "Day27 DIY - Incident Response, Runbook & Postmortem Documentation"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
