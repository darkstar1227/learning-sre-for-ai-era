[project]
name = "day19-sre-for-ai-era"
version = "0.1.0"
description = "Day19 DIY - golden dataset for AI evaluation"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.5.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
