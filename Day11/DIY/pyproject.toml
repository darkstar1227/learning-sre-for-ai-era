[project]
name = "day11-failure-modes"
version = "0.1.0"
description = "Production Failure Mode Design & Deadline Management"
readme = "README.md"
authors = [
    { name = "Justin Lee", email = "justin30303.jl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
