[project]
name = "day0-sre-for-ai-era"
version = "0.1.0"
description = "Day0 DIY - environment smoke test for Learning SRE for the AI Era"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "langsmith>=0.12.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

