[project]
name = "day22-dashboard-design"
version = "0.1.0"
description = "Day22 DIY: Three-layer dashboard design validation and FastAPI observability demo"
readme = "README.md"
authors = [
    { name = "Justin Lee", email = "justin.lee@cancerfree.io" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic",
    "fastapi",
    "uvicorn[standard]",
    "prometheus-client",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
